<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>maths tutoring</title>
        <meta name="title" content="maths tutoring">
        <link rel="icon" type="image/x-icon" href="./favicon.ico">

        <style>
            body {
                background-color: #111;
            }
            div {
                margin: auto;
                max-width: 750px;
                margin-top: 25px;
                overflow: hidden;
            }
            h1, h2, label, p {
                font-family: serif;
                color: #ddd;
            }
            h1, h2, p {
                text-align: center;
                margin: 0;
            }
            h1 {
                font-size: 4.5rem;
                rotate: -4deg;
                transition: rotate 0.2s;
            }
            h1.rotate {
                rotate: 2deg;
            }
            h2 {
                width: 100%;
                font-size: 2rem;
                transform: scale(1.5, 1);
            }
            p {
                margin-top: 10px;
                line-height: 2;
            }
            form {
                text-align: center;
                margin: 25px;
            }
            label, button, input, p {
                font-size: 1.2rem;
            }
            input, button {
                font-weight: bold;
                font-family: sans-serif;
                border-radius: 3px;
            }
            input {
                background-color: #111;
                color: #ddd;
                padding: 5px;
                border: 3px solid #ed5;
            }
            button {
                text-align: center;
                padding: 10px; 
                background-color: #ed5;
                color: #111;
                width: 150px;
                margin: 25px auto 25px auto;
                display: block;
                border: none;
                transition: scale 0.2s;
            }
            button:hover {
                scale: 1.02;
            }
            button:active {
                scale: 0.95;
            }
            img {
                display: block;
                margin: 50px auto 0 auto;
                width: 300px;
                transition: rotate 0.2s, scale 0.2s;
            }
            img:hover {
                rotate: 2deg;
                scale: 1.02;
            }
        </style>
    </head>
    <body>
        <div>
            <h2>wanna get</h2>
            <h1 id="h1">ahead?</h1>
            <p>
                online 1-to-1 a level maths + further maths tuition<br />
                <span style="color: #ed6">£25 / hour</span>
            </p>

            <form action="https://formsubmit.co/648b73f5ffdd299c5ea851efaaa402cb" method="POST">
                <label for="name">name:</label>
                <input type="text" name="name" required>
                <br /><br />
                <label for="email">email:</label>
                <input type="text" name="email" required>
                <button type="submit">send!</button>
            </form>

            <img src="./info.png" />
        </div>

        <script>
            setTimeout(
                () => {
                    document.getElementById("h1").classList.add("rotate");
                }, 1000
            );
        </script>
    </body>
</html>
